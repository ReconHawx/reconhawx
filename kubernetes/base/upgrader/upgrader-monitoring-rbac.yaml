# Namespaced permissions in monitoring for Helm (Loki, Alloy, Grafana) from the upgrader Job.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: upgrader-helm-monitoring
  namespace: monitoring
  labels:
    app: reconhawx
    component: upgrader
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "networking.k8s.io", "policy", "discovery.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["collectors.grafana.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upgrader-helm-monitoring
  namespace: monitoring
  labels:
    app: reconhawx
    component: upgrader
subjects:
  - kind: ServiceAccount
    name: upgrader-sa
    namespace: reconhawx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: upgrader-helm-monitoring
