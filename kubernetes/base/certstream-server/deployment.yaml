apiVersion: apps/v1
kind: Deployment
metadata:
  name: certstream-server
  labels:
    app: certstream-server
spec:
  replicas: 0
  selector:
    matchLabels:
      app: certstream-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: certstream-server
    spec:
      nodeSelector:
        reconhawx.runner: "true"
      containers:
      - name: certstream-server
        image: ghcr.io/reconhawx/reconhawx/certstream-server:1.6.0
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "4000"
        - name: HONEYBADGER_API_KEY
          value: ""
        ports:
        - name: http
          containerPort: 4000
          protocol: TCP
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /example.json
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /example.json
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 5
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
