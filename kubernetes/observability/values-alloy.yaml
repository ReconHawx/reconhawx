# Grafana Alloy Helm chart — DaemonSet collecting pod logs → Loki.
# Install:
#   helm upgrade --install alloy grafana/alloy -n monitoring \
#     -f kubernetes/observability/values-alloy.yaml \
#     --set-file alloy.configMap.content=kubernetes/observability/alloy-config.river
#
# If Loki runs under a different Service name or namespace, edit alloy-config.river (loki.write URL).

controller:
  type: daemonset
  nodeSelector: {}
  tolerations: []

alloy:
  clustering:
    enabled: false
  enableReporting: false
  mounts:
    varlog: false
    dockercontainers: false
  configMap:
    create: true
    # Prefer --set-file from alloy-config.river; placeholder if templating without --set-file:
    content: ""
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: false

rbac:
  create: true
