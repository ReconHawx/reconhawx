apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-monitor
  labels:
    app: ct-monitor
spec:
  replicas: 1  # Single instance is sufficient for CT stream
  selector:
    matchLabels:
      app: ct-monitor
  strategy:
    type: Recreate  # Don't run multiple instances
  template:
    metadata:
      labels:
        app: ct-monitor
    spec:
      nodeSelector:
        reconhawx.runner: "true"
      serviceAccountName: ct-monitor
      containers:
      - name: ct-monitor
        image: ghcr.io/reconhawx/reconhawx/ct-monitor:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        - name: CERTSTREAM_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: certstream.url
        - name: CT_CERTSTREAM_SCALE_ENABLED
          value: "true"
        - name: CERTSTREAM_DEPLOYMENT_NAME
          value: "certstream-server"
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: api.url
        
        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: nats.url
        
        - name: INTERNAL_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: internal-service-secret
              key: token
              optional: true
        
        - name: LOG_LEVEL
          value: "INFO"
        
        - name: CT_MONITOR_HTTP_HOST
          value: "0.0.0.0"
        
        - name: CT_MONITOR_HTTP_PORT
          value: "8002"
        
        ports:
        - name: http
          containerPort: 8002
          protocol: TCP
        
        # Liveness: cheap HTTP ping (no heavy status payload)
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

