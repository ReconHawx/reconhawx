# Reference only — not installed by reconhawx-observability-helm.sh (see values-grafana.yaml).
# Optional kube-prometheus-stack values if you re-enable full metrics (Prometheus, Alertmanager, node-exporter).
#
# kube-prometheus-stack — Prometheus Operator, Prometheus, Grafana, kube-state-metrics, node-exporter.
# Pin chart version in production (`helm search repo prometheus-community/kube-prometheus-stack --versions`).
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts && helm repo update
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack -n monitoring \
#     -f kubernetes/observability/values-kube-prometheus-stack.yaml
#
# Install Loki first. Grafana talks to the Loki gateway with X-Scope-OrgID (avoids Loki "no org id" errors).

defaultRules:
  create: true

prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  # Grafana Helm reads provider.disableDelete (not disableDeletion) and renders it as
  # disableDeletion in sc-dashboardproviders.yaml. When false, Grafana may drop dashboards
  # when the sidecar removes the JSON file (still flaky in some Grafana versions).
  # Provisioned dashboards cannot be removed with DELETE /api/dashboards/uid/...; remove the file.
  sidecar:
    dashboards:
      provider:
        disableDelete: false
  persistence:
    enabled: true
    size: 5Gi
  # The Grafana subchart's init-chown-data initContainer often fails on hardened / restricted
  # nodes (capabilities, read-only root, etc.). Let the kubelet apply fsGroup to the PVC
  # instead and skip the init (official Grafana image runs as UID/GID 472).
  podSecurityContext:
    fsGroup: 472
  initChownData:
    enabled: false
  # Served under the Reconhawx frontend nginx subpath /grafana/ (same browser Host as the UI).
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  # Name "Loki" is what built-in dashboards reference (kubernetes/observability/dashboards/*.json).
  # UID is stable for Explore links / API; do not rename without updating dashboards to match.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: reconhawx-loki
      access: proxy
      # Same-namespace short name; avoids rare cluster.local / ndots issues.
      url: http://loki-gateway.monitoring.svc:80
      isDefault: false
      jsonData:
        maxLines: 5000
        timeout: 120
        # Grafana reads HTTP header names from jsonData and values from secureJsonData.
        # "fake" is the usual single-tenant Loki org for loki-gateway (X-Scope-OrgID).
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: fake

prometheus-node-exporter:
  # Schedule on tainted nodes if needed, e.g.:
  # tolerations:
  #   - effect: NoSchedule
  #     operator: Exists
  tolerations: []
