# Standalone Grafana Helm chart (grafana/grafana) — logs UI only; no Prometheus.
# Pin chart version in production (`helm search repo grafana/grafana --versions`).
#
#   helm repo add grafana https://grafana.github.io/helm-charts && helm repo update
#   helm upgrade --install grafana grafana/grafana -n monitoring \
#     -f kubernetes/observability/values-grafana.yaml
#
# Service name is forced to kps-grafana (fullnameOverride) so the frontend nginx proxy
# and docs stay aligned without rebuilding the frontend image.

fullnameOverride: kps-grafana

nodeSelector:
  reconhawx.runner: "true"

testFramework:
  enabled: false

initChownData:
  enabled: false

persistence:
  enabled: true
  size: 5Gi

grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s/grafana/"
    serve_from_sub_path: true

# Name "Loki" / uid reconhawx-loki match kubernetes/observability/dashboards/*.json.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: reconhawx-loki
        access: proxy
        url: http://loki-gateway.monitoring.svc:80
        isDefault: false
        jsonData:
          maxLines: 5000
          timeout: 120
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: fake

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    provider:
      disableDelete: false
