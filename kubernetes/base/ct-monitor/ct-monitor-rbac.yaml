apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ct-monitor-certstream-scaler
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ct-monitor-certstream-scaler
subjects:
- kind: ServiceAccount
  name: ct-monitor
  namespace: reconhawx
roleRef:
  kind: Role
  name: ct-monitor-certstream-scaler
  apiGroup: rbac.authorization.k8s.io
