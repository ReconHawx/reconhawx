# Grafana Loki Helm chart — SingleBinary, local PVC (no MinIO).
# Pin a chart version in production (`helm search repo grafana/loki --versions`).
#
#   helm repo add grafana https://grafana.github.io/helm-charts && helm repo update
#   helm upgrade --install loki grafana/loki -n monitoring -f kubernetes/observability/values-loki.yaml
#
# Verify Service and port after install:
#   kubectl get svc -n monitoring
# Alloy config in this repo expects: http://loki.monitoring.svc.cluster.local:3100
#
# Retention: set `loki.limits_config.retention_period` and compactor settings to match
# your compliance needs once the release renders cleanly (`helm template ...`).

# Stable Service name `loki` regardless of Helm release name.
fullnameOverride: loki

deploymentMode: SingleBinary

minio:
  enabled: false

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
