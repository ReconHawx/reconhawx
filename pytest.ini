[pytest]
testpaths = src/api/tests src/runner/tests src/ct-monitor/tests src/worker/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
markers =
    asyncio: marks tests as async (using pytest-asyncio)
filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated.*:DeprecationWarning
    ignore::PendingDeprecationWarning:starlette.formparsers
