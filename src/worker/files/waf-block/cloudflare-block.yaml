id: cloudflare-block

info:
  name: Vendor Cloudflare WAF block page
  author: reconhawx
  severity: info
  tags:
    - waf-block

http:
  - method: GET
    path:
      - "{{RootURL}}"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 403
          - 503
      - type: word
        words:
          - "Cloudflare"
        part: body
