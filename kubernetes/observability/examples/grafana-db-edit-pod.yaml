# Ephemeral pod: mount the Grafana PVC (while Grafana is scaled to 0) and run sqlite3
# against grafana.db. Use for stuck provisioned dashboards / orphaned rows only.
#
# 1) Scale Grafana down (release name here is kps — adjust if yours differs):
#      kubectl scale deploy -n monitoring kps-grafana --replicas=0
#      kubectl wait --for=delete pod -l app.kubernetes.io/name=grafana -n monitoring --timeout=120s
#    If the pod label differs: kubectl get pods -n monitoring | grep grafana
#
# 2) Confirm the PVC name (Helm release "kps" usually yields claimName kps-grafana):
#      kubectl get pvc -n monitoring | grep -i grafana
#    Edit spec.volumes[0].persistentVolumeClaim.claimName below if it does not match.
#
# 3) Apply this pod, wait until Ready, then exec:
#      kubectl apply -f kubernetes/observability/examples/grafana-db-edit-pod.yaml
#      kubectl wait --for=condition=Ready pod/grafana-db-edit -n monitoring --timeout=180s
#      kubectl exec -it -n monitoring pod/grafana-db-edit -- sh
#
#    Inside the pod (sqlite is installed on startup; DB is under /mnt/grafana):
#      cp /mnt/grafana/grafana.db /mnt/grafana/grafana.db.bak.$(date +%s)
#      sqlite3 /mnt/grafana/grafana.db
#
#    Example SQL (replace YOUR_DASHBOARD_UID, e.g. reconhawx-workflow-logs):
#      .headers on
#      SELECT id, uid, title FROM dashboard WHERE uid = 'YOUR_DASHBOARD_UID';
#      SELECT * FROM dashboard_provisioning WHERE dashboard_id IN (SELECT id FROM dashboard WHERE uid = 'YOUR_DASHBOARD_UID');
#      BEGIN;
#      DELETE FROM dashboard_provisioning WHERE dashboard_id IN (SELECT id FROM dashboard WHERE uid = 'YOUR_DASHBOARD_UID');
#      DELETE FROM dashboard_tag WHERE dashboard_id IN (SELECT id FROM dashboard WHERE uid = 'YOUR_DASHBOARD_UID');
#      DELETE FROM dashboard_version WHERE dashboard_id IN (SELECT id FROM dashboard WHERE uid = 'YOUR_DASHBOARD_UID');
#      DELETE FROM dashboard WHERE uid = 'YOUR_DASHBOARD_UID' AND is_folder = 0;
#      COMMIT;
#      .quit
#
# 4) Delete the debug pod and scale Grafana back:
#      kubectl delete pod -n monitoring grafana-db-edit --wait=true
#      kubectl scale deploy -n monitoring kps-grafana --replicas=1
#
# If the pod stays Pending: the PVC is still bound to another pod, or the volume is
# multi-attach / wrong zone — fix that before editing the database.
#
# Troubleshooting — `SELECT * FROM dashboard` returns no rows:
#   • Wrong PVC / wrong file: `ls -lh /mnt/grafana/` — grafana.db should be non-trivial
#     size (often hundreds of KB+). If it is tiny/empty, fix claimName or mount the PVC
#     that the Grafana Deployment actually uses (`kubectl -n monitoring get deploy kps-grafana -o yaml`).
#   • Grafana not using SQLite: `kubectl -n monitoring get deploy kps-grafana -o yaml | grep -i GF_DATABASE`
#     If you see postgres/mysql, dashboards live in that server — not in grafana.db.
#   • Sanity check in sqlite3: `.tables` (expect many Grafana tables), `SELECT COUNT(*) FROM org;`,
#     `SELECT COUNT(*) FROM dashboard_provisioning;`
#
# Grafana 11+ / 12+ (unified storage): dashboards are often in **`resource`** and **`resource_history`**
# (legacy **`dashboard`** / **`dashboard_provisioning`** may be empty). Discover rows:
#
#     .headers on
#     SELECT namespace, "group", resource, name, length(value) AS bytes
#       FROM resource
#      WHERE resource = 'dashboards' OR value LIKE '%reconhawx-workflow-logs%'
#      LIMIT 50;
#
#   Typical dashboard API group is **`dashboard.grafana.app`**; **`name`** is usually the dashboard UID.
#   Inspect one row before deleting. Remove matching rows from **`resource_history`** first, then **`resource`**
#   (order and extra FK tables can vary by Grafana patch — prefer the HTTP trash/API when possible).
#
apiVersion: v1
kind: Pod
metadata:
  name: grafana-db-edit
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-db-edit
spec:
  # Match Grafana’s data volume ownership when the chart uses fsGroup 472.
  securityContext:
    fsGroup: 472
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: shell
      image: docker.io/library/alpine:3.19
      command: ["/bin/sh", "-c"]
      args:
        - apk add --no-cache sqlite && exec sleep infinity
      volumeMounts:
        - name: grafana-data
          mountPath: /mnt/grafana
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
  volumes:
    - name: grafana-data
      persistentVolumeClaim:
        # Change this to the PVC backing deploy/kps-grafana (see step 2).
        claimName: kps-grafana
  restartPolicy: Never
