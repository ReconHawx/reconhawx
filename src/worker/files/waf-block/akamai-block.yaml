id: akamai-block

info:
  name: Vendor Akamai WAF denial
  author: reconhawx
  severity: info
  tags:
    - waf-block

http:
  - method: GET
    path:
      - "{{RootURL}}"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 403
          - 503
      - type: dsl
        dsl:
          - 'contains(header, "AkamaiGHost") || contains(body, "Reference #")'
