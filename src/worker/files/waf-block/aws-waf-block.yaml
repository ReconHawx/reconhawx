id: aws-waf-block

info:
  name: Vendor AWS WAF block response
  author: reconhawx
  severity: info
  tags:
    - waf-block

http:
  - method: GET
    path:
      - "{{RootURL}}"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 403
          - 503
      - type: dsl
        dsl:
          - 'contains(to_lower(header),"x-amzn-requestid") && contains(body, "Request blocked")'
